            set_env "WB2_PRICES_KEY" "eyJhbGciOiJFUzI1NiIsImtpZCI6IjIwMjYwMzAydjEiLCJ0eXAiOiJKV1QifQ.eyJhY2MiOjEsImVudCI6MSwiZXhwIjoxNzkxMTc3MTc0LCJpZCI6IjAxOWQ1ZWEyLTE4ZTctNzA1OC04ZDU3LTEwMGIyOWYzOTgyOSIsImlpZCI6NTM2OTIyMTEsIm9pZCI6MjUwMDAxNzMzLCJzIjoxMDMyLCJzaWQiOiI2MjM5MGM1ZS0xZDQyLTQxODUtYWI3Mi0wMGZhZDE3YzAyZWUiLCJ0IjpmYWxzZSwidWlkIjo1MzY5MjIxMX0.sGgqTj51uLVS1AiQYxGeu9_en_g49k96yyXNQYPGt0SeXbnaARE-oIkp6QacHlPuCxUeS1cdx-KG0SagnF99Vg"

            # Login to GHCR
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Ensure webproxy network exists
            docker network create webproxy 2>/dev/null || true

            # Pull latest image
            docker compose -f docker-compose.prod.yml pull web

            # Restart services (migrations run automatically on container start)
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Reload nginx (from pdnguard stack)
            docker exec pdnguard-nginx nginx -s reload 2>/dev/null || true

            # Cleanup old images
            docker image prune -f

            # Verify health
            sleep 10
            curl -sf http://localhost:3002/ || echo "⚠️ Health check failed"
