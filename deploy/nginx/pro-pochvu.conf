# === HTTP → HTTPS redirects for all domains ===
server {
    listen 80;
    server_name ecokon.ru www.ecokon.ru pro-pochvu.ru www.pro-pochvu.ru xn--b1axacbez4a.xn--p1ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://pro-pochvu.ru$request_uri;
    }
}

# === HTTPS ecokon.ru → 301 → pro-pochvu.ru ===
server {
    listen 443 ssl;
    http2 on;
    server_name ecokon.ru www.ecokon.ru;

    ssl_certificate /etc/letsencrypt/live/ecokon.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecokon.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://pro-pochvu.ru$request_uri;
}

