# === HTTPS pro-pochvu.ru — основной сайт ===
server {
    listen 443 ssl;
    http2 on;
    server_name pro-pochvu.ru;

    ssl_certificate /etc/letsencrypt/live/pro-pochvu.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pro-pochvu.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Docker internal DNS — resolve at runtime, not startup
    resolver 127.0.0.11 valid=30s;
    set $ecokon_backend http://ecokon-web:3002;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Security headers
    # X-Frame-Options + CSP frame-ancestors: allow self + Yandex (Metrika Webvisor replays pages in an iframe)
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.yandex.ru https://yandex.ru https://webvisor.com" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml image/svg+xml;

    # Next.js API routes (payment webhooks, delivery webhooks, etc.)
    location /api/ {
        proxy_pass $ecokon_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # Next.js static assets — long cache
    location /_next/static/ {
        proxy_pass $ecokon_backend;
        proxy_http_version 1.1;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Next.js app
    location / {
        proxy_pass $ecokon_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    client_max_body_size 10M;
}
