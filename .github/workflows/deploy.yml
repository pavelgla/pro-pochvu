name: Deploy Ecokon

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}/web

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecokon_test
          POSTGRES_USER: ecokon
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://ecokon:test_password@localhost:5432/ecokon_test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ecokon:test_password@localhost:5432/ecokon_test
          NEXTAUTH_SECRET: test-secret-for-build
          NEXTAUTH_URL: http://localhost:3002

  build-and-push:
    name: Build & push Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://pro-pochvu.ru
            NEXT_PUBLIC_YMAPS_API_KEY=${{ secrets.NEXT_PUBLIC_YMAPS_API_KEY }}
            NEXT_PUBLIC_METRIKA_ID=${{ secrets.NEXT_PUBLIC_METRIKA_ID }}
            NEXT_PUBLIC_VK_PIXEL_ID=${{ secrets.NEXT_PUBLIC_VK_PIXEL_ID }}
            NEXT_PUBLIC_SHOW_TSVETOLOGIYA=true
            NEXT_PUBLIC_YANDEX_VERIFICATION=53a70f2c26dfd38f
            NEXT_PUBLIC_GOOGLE_VERIFICATION=scIwgrTC_5V2PiG2S9E5T8u_AYsFkB4ctn6PLVCnXNM
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Sync config files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,deploy/"
          target: /opt/ecokon
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/ecokon

            # Inject secrets into .env (create or update without duplicates)
            set_env() {
              key="$1"; val="$2"; file=".env"
              touch "$file"
              if grep -q "^${key}=" "$file" 2>/dev/null; then
                sed -i "s|^${key}=.*|${key}=${val}|" "$file"
              else
                echo "${key}=${val}" >> "$file"
              fi
            }
            set_env "OZON_CLIENT_ID" "${{ secrets.OZON_CLIENT_ID }}"
            set_env "OZON_API_KEY" "${{ secrets.OZON_API_KEY }}"
            set_env "OZON2_CLIENT_ID" "${{ secrets.OZON2_CLIENT_ID }}"
            set_env "OZON2_API_KEY" "${{ secrets.OZON2_API_KEY }}"
            set_env "WB_API_KEY" "${{ secrets.WB_API_KEY }}"
            set_env "WB2_API_KEY" "${{ secrets.WB2_API_KEY }}"
            # WB Statistics keys (Content API: descriptions + photo URLs)
            set_env "WB_STATS_KEY" "${{ secrets.WB_STATS_KEY }}"
            set_env "WB2_STATS_KEY" "${{ secrets.WB2_STATS_KEY }}"
            # WB Prices keys (Цены и скидки — discounts-prices-api.wb.ru)
            set_env "WB_PRICES_KEY" "${{ secrets.WB_PRICES_KEY }}"
            set_env "WB2_PRICES_KEY" "${{ secrets.WB2_PRICES_KEY }}"
            set_env "TELEGRAM_BOT_TOKEN" "${{ secrets.TELEGRAM_BOT_TOKEN }}"
            set_env "TELEGRAM_CHAT_ID" "134445625"
            # Email SMTP (Mail.ru для бизнеса)
            set_env "EMAIL_SMTP_HOST" "smtp.mail.ru"
            set_env "EMAIL_SMTP_PORT" "465"
            set_env "EMAIL_SMTP_USER" "${{ secrets.EMAIL_SMTP_USER }}"
            set_env "EMAIL_SMTP_PASS" "${{ secrets.EMAIL_SMTP_PASS }}"
            set_env "EMAIL_SMTP_FROM" "Эко Конь <noreply@pro-pochvu.ru>"
            set_env "EMAIL_SMTP_SECURE" "true"

            # Login to GHCR
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Ensure webproxy network exists
            docker network create webproxy 2>/dev/null || true

            # Pull latest image
            docker compose -f docker-compose.prod.yml pull web

            # Restart services (migrations run automatically on container start)
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --force-recreate

            # nginx: на sel1 единый proxy-nginx (/opt/proxy), pro-pochvu.conf уже в conf.d
            cp /opt/ecokon/deploy/nginx/pro-pochvu.conf /opt/proxy/nginx/conf.d/pro-pochvu.conf 2>/dev/null || true
            docker exec proxy-nginx nginx -s reload 2>/dev/null || true

            # Cleanup old images
            docker image prune -f

            # Verify health
            sleep 10
            curl -sf http://localhost:3002/ || echo "⚠️ Health check failed"
