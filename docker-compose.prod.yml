services:
  postgres:
    image: postgres:16-alpine
    container_name: ecokon-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecokon}
      POSTGRES_USER: ${POSTGRES_USER:-ecokon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ecokon_pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecokon}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/pavelgla/pro-pochvu/web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://pro-pochvu.ru
        NEXT_PUBLIC_YMAPS_API_KEY: ${NEXT_PUBLIC_YMAPS_API_KEY:-}
        NEXT_PUBLIC_METRIKA_ID: ${NEXT_PUBLIC_METRIKA_ID:-}
        NEXT_PUBLIC_VK_PIXEL_ID: ${NEXT_PUBLIC_VK_PIXEL_ID:-}
        NEXT_PUBLIC_SHOW_TSVETOLOGIYA: "true"
        NEXT_PUBLIC_YANDEX_VERIFICATION: ${NEXT_PUBLIC_YANDEX_VERIFICATION:-}
        NEXT_PUBLIC_GOOGLE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_VERIFICATION:-}
        NEXT_PUBLIC_MAILRU_VERIFICATION: ${NEXT_PUBLIC_MAILRU_VERIFICATION:-}
    container_name: ecokon-web
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecokon}:${POSTGRES_PASSWORD}@ecokon-db:5432/${POSTGRES_DB:-ecokon}
      NEXTAUTH_URL: https://pro-pochvu.ru
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY}
      APISHIP_API_KEY: ${APISHIP_API_KEY}
      APISHIP_FROM_CITY_ID: ${APISHIP_FROM_CITY_ID}
      APISHIP_PLATFORM_ID: ${APISHIP_PLATFORM_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.mail.ru}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASS: ${EMAIL_SMTP_PASS}
      EMAIL_SMTP_FROM: ${EMAIL_SMTP_FROM:-Эко Конь <noreply@pro-pochvu.ru>}
      EMAIL_SMTP_SECURE: ${EMAIL_SMTP_SECURE:-true}
      OZON_CLIENT_ID: ${OZON_CLIENT_ID:-}
      OZON_API_KEY: ${OZON_API_KEY:-}
      OZON2_CLIENT_ID: ${OZON2_CLIENT_ID:-}
      OZON2_API_KEY: ${OZON2_API_KEY:-}
      WB_API_KEY: ${WB_API_KEY:-}
      WB2_API_KEY: ${WB2_API_KEY:-}
      WB_STATS_KEY: ${WB_STATS_KEY:-}
      WB2_STATS_KEY: ${WB2_STATS_KEY:-}
      WB_PRICES_KEY: ${WB_PRICES_KEY:-}
      WB2_PRICES_KEY: ${WB2_PRICES_KEY:-}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
    networks:
      - webproxy
      - internal

volumes:
  ecokon_pgdata:

networks:
  webproxy:
    external: true
  internal:
    driver: bridge
